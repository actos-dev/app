name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: typecheck · lint · tokens · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      # next typegen şart: next-env.d.ts ve route tipleri (.next/types) taze klonda yok.
      - name: Tip kontrolü
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tasarım token kapısı
        run: npm run check:tokens

      - name: Unit testler
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e · playwright
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Playwright Chromium kur
        run: npx playwright install --with-deps chromium

      # E2E, üretim derlemesini `next start` ile sunar; derleme ayrı adımda.
      - name: Build
        run: npm run build

      - name: E2E testleri
        run: npm run e2e

      - name: Playwright raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
