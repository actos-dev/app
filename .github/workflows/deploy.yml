name: deploy

# v* tag = deploy tetikleyicisi (veya elle `workflow_dispatch`).
# İmaj GitHub Actions'ta derlenir ve GHCR'a itilir; sunucu yalnız `docker pull`
# yapar. Böylece sunucuda derleme yükü/RAM baskısı olmaz ve runner'da test
# edilen byte'ların aynısı çalışır.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy edilecek tag (ör. v1.0.0)"
        required: true
        type: string

concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/actos-dev/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      # Kalite kapıları: typecheck + lint + tokens + test. Başarısızsa imaj
      # itilmez, deploy adımı çalışmaz.
      - name: Kalite kapıları
        run: npm run check

      - name: GHCR girişi
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_* derleme anında gömülür; prod değerleri burada verilir.
      - name: İmajı derle ve GHCR'a it
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag || github.ref_name }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://florencex.com.tr
            NEXT_PUBLIC_PORTFOLIO_COMMISSION_RATE=0.001
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sunucuda çalıştır · sağlık · rollback
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_TAG: ${{ inputs.tag || github.ref_name }}
          IMAGE: ${{ env.IMAGE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_TAG,IMAGE,GHCR_TOKEN,GHCR_ACTOR
          script_stop: true
          # Not: `set -x` yok, env dosyası cat edilmez; sırlar loga düşmez.
          script: |
            set -euo pipefail

            ENV_FILE=/etc/florence/app.env
            NAME=florence_app
            NETWORK=florence_default
            PORT_HOST=3300
            HEALTH_URL=http://127.0.0.1:${PORT_HOST}/api/health
            TAG="${DEPLOY_TAG:?deploy tag gerekli}"

            if [ ! -f "$ENV_FILE" ]; then
              echo "HATA: $ENV_FILE yok; deploy durduruldu." >&2
              exit 1
            fi

            # Paket private olduğu için çalışma süresince geçerli GITHUB_TOKEN ile
            # giriş yapılır; `--password-stdin` sayesinde token loga düşmez.
            if [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_ACTOR:?}" --password-stdin >/dev/null
            fi

            docker pull "${IMAGE}:${TAG}"

            # Rollback için önceki imajı değişmez kimliğiyle sakla.
            PREV_ID="$(docker inspect --format '{{.Image}}' "$NAME" 2>/dev/null || true)"
            if [ -n "$PREV_ID" ]; then
              docker tag "$PREV_ID" "florence-app:previous"
              echo "Önceki imaj kaydedildi (florence-app:previous)"
            else
              echo "Önceki imaj yok (ilk deploy)."
            fi

            run_container() {
              docker run -d --name "$NAME" \
                --restart unless-stopped \
                --memory 512m --memory-swap 1g \
                --env-file "$ENV_FILE" \
                --network "$NETWORK" \
                -p "127.0.0.1:${PORT_HOST}:3000" \
                "$1" >/dev/null
            }

            docker stop "$NAME" >/dev/null 2>&1 || true
            docker rm "$NAME" >/dev/null 2>&1 || true
            run_container "${IMAGE}:${TAG}"

            ok=""
            for _ in $(seq 1 45); do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then ok="1"; break; fi
              sleep 2
            done

            if [ -z "$ok" ]; then
              echo "HATA: /api/health 200 dönmedi; önceki imaja rollback yapılıyor." >&2
              docker logs --tail 50 "$NAME" >&2 || true
              docker rm -f "$NAME" >/dev/null 2>&1 || true
              if [ -n "$PREV_ID" ]; then
                run_container "$PREV_ID"
                echo "Rollback tamamlandı." >&2
              else
                echo "Rollback yapılamadı (önceki imaj yok)." >&2
              fi
              exit 1
            fi

            echo "Deploy başarılı: ${IMAGE}:${TAG}"
            curl -fsS "$HEALTH_URL"; echo
