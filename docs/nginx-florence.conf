# Florence App — nginx örneği (Faz 6 / Birim 6.5, plan M-11).
#
# Amaç: TLS sonlandırma + tek giriş noktası; `/` ve `/api/` uygulamaya
# (127.0.0.1:3000, standalone container) proxy'lenir. nginx statik dosya
# SUNMAZ: statikler (`/_next/static`, `public/*`) Next tarafından servis edilir.
#
# Kritik kurallar:
#   1. `/api/` BACKEND'e DEĞİL, Next'e gider. BFF (`app/api/v1/[...path]`)
#      tarayıcının gördüğü origin'de olmalıdır; refresh çerezi
#      `path=/api/v1/auth` ile yazıldığı için aksi halde oturum bozulur.
#   2. `X-Forwarded-For` EZİLİR (`$remote_addr`), eklenmez. `$proxy_add_x_forwarded_for`
#      kullanılırsa istemci sahte IP ile anonim rate limit'i atlatır.
#   3. Güvenlik başlıkları (HSTS, nosniff, Referrer-Policy, Permissions-Policy,
#      X-Frame-Options) ve CSP Next tarafından gönderilir. nginx bunları
#      EKLEMEZ/EZMEZ; CSP istek başına nonce taşır, nginx'te yazılan bir CSP
#      script'leri engeller.

# Anonim trafik için ikinci savunma hattı (backend'in kendi IP limiti de var).
# nginx gerçek istemci IP'sini gördüğü için burada anlamlıdır.
limit_req_zone $binary_remote_addr zone=app_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=app_auth:10m rate=10r/m;

# HTTP → HTTPS yönlendirmesi. TLS sonlandırma bu katmanda yapılır; HSTS
# yalnız HTTPS üzerinden etkilidir (Next başlığı gönderir).
server {
    listen 80;
    listen [::]:80;
    server_name florencex.com.tr;

    # ACME http-01 challenge (certbot webroot) gerekirse buraya location ekleyin.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name florencex.com.tr;

    # --- TLS (yolları sunucuya göre düzenleyin) ---
    ssl_certificate     /etc/letsencrypt/live/florencex.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/florencex.com.tr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Avatar/veri yüklemeleri için üst sınır (backend limitiyle uyumlu tutun).
    client_max_body_size 25m;

    # Uzun süren uçlar: rapor 30-60 sn, simülasyon 600 sn'ye kadar (B-09).
    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    proxy_http_version    1.1;
    # Upstream keep-alive (Connection başlığı boşaltılır).
    proxy_set_header Connection "";

    # --- Ortak proxy başlıkları ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # DİKKAT: ezilir, eklenmez (anonim IP limiti güveni).
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Next streaming (App Router) için tamponlamayı kapat (Next self-hosting).
    proxy_set_header X-Accel-Buffering no;
    proxy_buffering off;

    # BFF: `/api/` Next'e gider (backend'e değil). Auth uçları daha sıkı.
    location /api/v1/auth/ {
        limit_req zone=app_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/ {
        limit_req zone=app_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Uygulama (tüm route'lar Next'te; SPA fallback gerekmez).
    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    # --- Eski `/downloads` davranışı (opsiyonel) ---
    # Next `/downloads` sayfasını ve `public/downloads/*` dosyalarını kendisi
    # sunar; ayrı bir rewrite GEREKMEZ. Çok büyük binary'leri nginx'ten doğrudan
    # servis etmek isterseniz, aşağıdaki bloğu `location /` bloğundan ÖNCE açın
    # ve dosyaları `/var/www/florence-downloads` altına koyun. Bu durumda
    # manifestin uygulamaya da görünmesi için `public/downloads/manifest.json`
    # mount edilmeye devam etmelidir (bkz. docs/deployment-notes.md).
    #
    # location ^~ /downloads/ {
    #     alias /var/www/florence-downloads/;
    #     autoindex off;
    #     add_header Cache-Control "public, max-age=3600";
    # }
}
